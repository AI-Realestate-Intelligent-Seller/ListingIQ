<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f7fb" />
  <title>ListingIQ — SMS Inbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 17.5 4 20v-5.2A7.5 7.5 0 0 1 3 11C3 6.6 7 3 12 3s9 3.6 9 8-4 8-9 8a10 10 0 0 1-5-.5Z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></svg>
        </div>
        <div class="brand-copy">
          <span class="brand-name">ListingIQ</span>
          <span class="brand-tagline">SMS workspace</span>
        </div>
        <button class="icon-button mobile-only" id="closeSidebarBtn" aria-label="Close conversations">
          <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <button class="primary-button new-message-button" id="composeBtn">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        New conversation
      </button>

      <div class="section-heading">
        <span>Messages</span>
        <span class="count-badge" id="conversationCount">0</span>
      </div>

      <label class="search-box" for="conversationSearch">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="conversationSearch" type="search" placeholder="Search conversations" autocomplete="off" />
      </label>

      <div id="conversationsList" class="conversations-list" aria-live="polite"></div>

      <div class="sidebar-footer">
        <label class="import-button" for="csvFile">
          <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v5h14v-5"/></svg>
          <span>Import CSV</span>
          <input id="csvFile" type="file" accept=".csv,text/csv" />
        </label>
        <div id="bulkStatus" class="bulk-status" aria-live="polite"></div>
        <div class="connection-state"><span class="status-dot"></span><span>Webhook connected</span></div>
      </div>
    </aside>

    <main class="chat-panel">
      <header class="chat-header">
        <button class="icon-button mobile-only" id="openSidebarBtn" aria-label="Open conversations">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="contact-avatar" id="headerAvatar">R</div>
        <div class="chat-heading">
          <h1 id="chatTitle">Your messages</h1>
          <p id="chatSubtitle">Choose a conversation to get started</p>
        </div>
        <button class="ai-status" id="aiToggleBtn" type="button" disabled aria-pressed="false" title="Toggle AI autopilot">
          <span class="ai-spark">✦</span>
          <span id="aiStatusText">Bobbie off</span>
        </button>
        <button class="ai-status recipient-ai-status" id="recipientAiToggleBtn" type="button" disabled aria-pressed="false" title="Toggle simulated recipient AI">
          <span class="ai-spark">◉</span>
          <span id="recipientAiStatusText">Recipient off</span>
        </button>
        <button class="icon-button rename-button" id="setNameBtn" title="Rename contact" aria-label="Rename contact" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>
        </button>
        <button class="icon-button delete-conversation-button" id="deleteConversationBtn" title="Delete conversation" aria-label="Delete conversation" disabled>
          <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>
        </button>
      </header>

      <div id="messages" class="messages chat-messages" aria-live="polite">
        <div class="empty-state" id="emptyState">
          <div class="empty-illustration" aria-hidden="true">
            <svg viewBox="0 0 64 64"><path d="M18 43 9 50l2.5-13A23 23 0 1 1 18 43Z"/><path d="M22 27h20M22 34h13"/></svg>
          </div>
          <h2>Conversations, all in one place</h2>
          <p>Select a message from the sidebar or start a new conversation.</p>
          <button class="secondary-button" id="emptyComposeBtn">Start a conversation</button>
        </div>
      </div>
      <button class="scroll-latest" id="scrollLatestBtn" type="button" aria-label="Scroll to latest message" hidden>
        <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        <span>Latest</span>
      </button>

      <form class="chat-composer" id="chatForm">
        <label class="sr-only" for="chatInput">Message</label>
        <textarea id="chatInput" rows="1" maxlength="1600" placeholder="Select a conversation to send a message" disabled></textarea>
        <div class="composer-actions">
          <label class="sender-mode" id="senderModeField" hidden>
            <span>Send as</span>
            <select id="senderMode" aria-label="Send message as">
              <option value="bobbie">Bobbie</option>
              <option value="recipient">Recipient</option>
            </select>
          </label>
          <span class="character-count" id="characterCount">0 / 1600</span>
          <button class="send-button" id="chatSendBtn" type="submit" disabled>
            <span>Send</span>
            <svg viewBox="0 0 24 24"><path d="m5 12 14-7-4 14-3-6-7-1Z"/><path d="m12 13 7-8"/></svg>
          </button>
        </div>
      </form>
    </main>
  </div>

  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <dialog id="contactDialog" class="contact-dialog">
    <form method="dialog" id="contactForm">
      <div class="dialog-header">
        <div>
          <span class="eyebrow" id="dialogEyebrow">New conversation</span>
          <h2 id="dialogTitle">Start Conversation</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <label class="field">
        <span>Name</span>
        <input id="contactName" type="text" placeholder="e.g. Maya Chen" autocomplete="name" required />
      </label>
      <label class="field" id="phoneField">
        <span>Phone number</span>
        <input id="contactPhone" type="tel" placeholder="+1 555 000 0000" autocomplete="tel" required />
        <small>Use international E.164 format, including the country code.</small>
      </label>
      <label class="field" id="propertyField">
        <span>Property address</span>
        <input id="propertyAddress" type="text" placeholder="e.g. 123 Maple Ave, Austin, TX" autocomplete="street-address" required />
        <small>Used as context for the initial outreach and follow-up replies.</small>
      </label>
      <label class="field" id="outreachReasonField">
        <span>Outreach reason</span>
        <textarea id="outreachReason" rows="3" maxlength="300" placeholder="e.g. The property appears to have come off the market without a recorded sale." required></textarea>
        <small>Bobbie will use this exact reason to explain why she contacted this owner.</small>
      </label>
      <label class="automation-option" id="automationField">
        <input id="aiEnabled" type="checkbox" />
        <span class="automation-switch" aria-hidden="true"></span>
        <span><strong>Bobbie AI</strong><small>Send Bobbie’s introduction now and automatically answer recipient messages.</small></span>
      </label>
      <label class="automation-option" id="recipientAutomationField">
        <input id="recipientAiEnabled" type="checkbox" />
        <span class="automation-switch" aria-hidden="true"></span>
        <span><strong>Recipient AI</strong><small>Automatically generate simulated recipient replies to Bobbie.</small></span>
      </label>
      <p class="dialog-error" id="dialogError" role="alert"></p>
      <div class="dialog-actions">
        <button class="secondary-button" value="cancel">Cancel</button>
        <button class="primary-button" id="saveContactBtn" value="default">Start Conversation</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirmDialog" class="confirm-dialog">
    <form method="dialog">
      <div class="confirm-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/></svg>
      </div>
      <h2 id="confirmTitle">Delete message?</h2>
      <p id="confirmCopy">This action cannot be undone.</p>
      <div class="dialog-actions">
        <button class="secondary-button" value="cancel">Cancel</button>
        <button class="danger-button" id="confirmDeleteBtn" value="confirm">Delete</button>
      </div>
    </form>
  </dialog>

  <div id="notification" class="notification" role="status" aria-live="polite" hidden></div>
  <script src="/client.js"></script>
</body>
</html>
